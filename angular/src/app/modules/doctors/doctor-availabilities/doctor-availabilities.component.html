
<!-- Show Doctor's Name if Available -->
<h2 *ngIf="availability.length > 0" class="mb-4">
    {{ availability[0]?.name }}
  </h2>

<table class="table align-items-center table-flush" *ngIf="availability.length > 0">
    <thead  class="table-light">
        <tr>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let slot of availability">
            <td>{{ slot.day }}</td>
            <td>{{ slot.startTime }}</td>
            <td>{{ slot.endTime }}</td>
        </tr>
    </tbody>
</table>

<div *ngIf="availability.length === 0" class="alert alert-info">
    No availability found for this doctor.
</div>

<button class="btn btn-secondary" (click)="goBack()">Back to Doctors</button>
